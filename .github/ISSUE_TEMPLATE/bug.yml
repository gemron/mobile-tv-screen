name: 缺陷与兼容性问题
description: 报告投屏、播放或安装问题；请先移除日志中的签名、令牌和私人信息。
body:
  - type: input
    id: version
    attributes:
      label: MobileTV 版本
      placeholder: 例如 1.0.2 安装版
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、手机型号/系统版本、视频 App 与版本、使用的投屏入口。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与实际结果
      description: 同时说明内置测试视频、其他 App 或片源是否正常。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的诊断信息
      description: 不要公开访问签名、Cookie、令牌、私人媒体链接或完整设备标识。
      render: text
